<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highlife · Event Team DB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0a0a;--s1:#111;--s2:#161616;--s3:#1c1c1c;
--gold:#d4a843;--goldd:#8b7635;--goldg:rgba(212,168,67,.1);
--grn:#6b8f4a;--red:#8b2020;--redd:#3a2020;
--t1:#e0e0e0;--t2:#aaa;--t3:#666;--t4:#444;--t5:#2a2a2a;
--brd:#1a1a1a;--mono:'JetBrains Mono',monospace;--sans:'Outfit',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--sans);overflow:hidden}

/* LOGIN */
#login{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column}
#login .brand{font-size:13px;letter-spacing:8px;color:var(--gold);font-weight:700;margin-bottom:8px}
#login h1{font-size:32px;font-weight:800;margin-bottom:4px}
#login .sub{font-size:11px;color:var(--t4);letter-spacing:4px;margin-bottom:32px}
#login input{background:var(--s1);border:1px solid var(--t5);color:var(--t1);padding:14px 20px;font-size:15px;letter-spacing:3px;font-family:var(--mono);text-align:center;width:280px;outline:none}
#login input:focus{border-color:var(--goldd)}
#login input.err{border-color:var(--red)}
#login button{margin-top:12px;background:var(--gold);color:var(--bg);border:none;padding:12px 40px;font-size:13px;font-weight:700;letter-spacing:3px;cursor:pointer;font-family:var(--sans)}
#login button:hover{filter:brightness(1.1)}
#login .errmsg{color:var(--red);font-size:11px;margin-top:10px;letter-spacing:1px;height:16px}

/* APP SHELL */
#app{display:none;height:100vh;flex-direction:column}
#app.show{display:flex}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--brd);flex-shrink:0}
.hdr .left{display:flex;align-items:baseline;gap:12px}
.hdr .brand{font-size:11px;letter-spacing:6px;color:var(--gold);font-weight:700}
.hdr .title{font-size:16px;font-weight:700}
.hdr .meta{font-size:10px;color:var(--t4);font-family:var(--mono)}
.main{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sb{width:220px;border-right:1px solid var(--brd);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;background:var(--s1)}
.sb-search{padding:12px;border-bottom:1px solid var(--brd)}
.sb-search input{width:100%;background:var(--s2);border:1px solid var(--t5);color:var(--t1);padding:9px 12px;font-size:14px;font-family:var(--sans);outline:none}
.sb-search input:focus{border-color:var(--goldd)}
.sb-sect{padding:8px 0;border-bottom:1px solid var(--brd)}
.sb-sect-title{font-size:10px;letter-spacing:2px;color:var(--t4);padding:4px 16px 6px;font-weight:600}
.sb-item{display:flex;justify-content:space-between;padding:6px 16px;cursor:pointer;font-size:13px;color:var(--t3);transition:all .1s;border-left:2px solid transparent}
.sb-item:hover{color:var(--t2);background:var(--s2)}
.sb-item.on{color:var(--gold);background:var(--goldg);border-left-color:var(--gold)}
.sb-item .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item .c{font-size:10px;color:var(--t4);font-family:var(--mono);flex-shrink:0;margin-left:8px}
.sb-item.on .c{color:var(--goldd)}

/* Event list section */
.sb-evt-item{display:flex;justify-content:space-between;align-items:center;padding:5px 16px;font-size:12px;color:var(--t3);cursor:pointer;border-left:2px solid transparent}
.sb-evt-item:hover{color:var(--t2);background:var(--s2)}
.sb-evt-item.on{color:var(--gold);background:var(--goldg);border-left-color:var(--gold)}
.sb-evt-item .del{color:var(--t5);cursor:pointer;font-size:14px;padding:0 4px;background:none;border:none}
.sb-evt-item .del:hover{color:var(--red)}
.sb-add{display:flex;gap:4px;padding:6px 12px}
.sb-add input{flex:1;background:var(--s2);border:1px solid var(--t5);color:var(--t1);padding:5px 8px;font-size:12px;font-family:var(--sans);outline:none;min-width:0}
.sb-add button{background:var(--gold);color:var(--bg);border:none;padding:5px 10px;font-size:10px;font-weight:700;cursor:pointer;font-family:var(--sans);letter-spacing:1px;flex-shrink:0}
.sb-bottom{margin-top:auto;border-top:1px solid var(--brd);padding:10px 16px}
.sb-bottom button{width:100%;background:var(--s2);border:1px solid var(--t5);color:var(--t3);padding:7px;font-size:11px;cursor:pointer;font-family:var(--sans);letter-spacing:1px}
.sb-bottom button:hover{color:var(--t2);border-color:var(--t4)}

/* PW MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100}
.modal-bg.show{display:flex}
.modal{background:var(--s1);border:1px solid var(--t5);padding:24px;width:320px}
.modal h3{font-size:16px;margin-bottom:16px;font-weight:600}
.modal input{width:100%;background:var(--s2);border:1px solid var(--t5);color:var(--t1);padding:10px 12px;font-size:14px;font-family:var(--mono);outline:none;margin-bottom:10px;letter-spacing:2px;text-align:center}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.modal .btns button{padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);border:none;letter-spacing:1px}
.modal .cancel{background:var(--s2);color:var(--t3)}
.modal .save{background:var(--gold);color:var(--bg)}
.modal .msg{font-size:11px;margin-top:6px;height:14px}
.modal .msg.ok{color:var(--grn)}
.modal .msg.err{color:var(--red)}

/* CONTENT AREA */
.content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column}
.content-info{font-size:11px;color:var(--t4);font-family:var(--mono);letter-spacing:1px;margin-bottom:12px;padding:0 4px}

/* CARD GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;align-content:start}
.card{background:var(--s2);border:1px solid var(--t5);padding:12px 14px;cursor:pointer;transition:all .12s;display:flex;flex-direction:column}
.card:hover{border-color:var(--t4);background:var(--s3)}
.card.cp{border-color:var(--gold);background:rgba(212,168,67,.06)}
.card .label{font-size:15px;color:var(--t1);font-weight:600;line-height:1.3;margin-bottom:4px}
.card .code{font-family:var(--mono);font-size:12px;color:var(--gold);word-break:break-all;line-height:1.4;margin-bottom:auto}
.card .bottom{display:flex;align-items:center;margin-top:10px;gap:4px}
.card .actions{display:flex;gap:3px;align-items:center}
.card select{background:var(--s1);border:1px solid var(--t5);color:var(--t3);font-size:10px;padding:2px 3px;font-family:var(--mono);cursor:pointer;max-width:80px}
.card .copied-badge{font-size:10px;color:var(--gold);font-weight:600;letter-spacing:1px}

/* EVENT VIEW */
.evt-view{display:flex;flex-direction:column;gap:10px}
.evt-card{background:var(--s2);border:1px solid var(--t5);padding:10px 14px;display:grid;grid-template-columns:1fr 2fr auto auto;gap:12px;align-items:center;cursor:pointer;transition:background .1s}
.evt-card:hover{background:var(--s3)}
.evt-card .code{font-family:var(--mono);font-size:14px;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evt-card .label{font-size:13px;color:var(--t2)}
.evt-card .rm{background:none;border:none;color:var(--t5);font-size:16px;cursor:pointer;padding:2px 6px}
.evt-card .rm:hover{color:var(--red)}
.evt-card .ck{font-size:12px;color:var(--gold);width:14px}

.show-more{display:block;width:100%;padding:14px;background:var(--s1);border:1px solid var(--t5);color:var(--t3);font-size:13px;cursor:pointer;font-family:var(--sans);letter-spacing:1px;margin-top:10px;text-align:center}
.show-more:hover{color:var(--t1)}

/* PAWN LIST */
.pawn-list{display:flex;flex-direction:column;gap:0}
.pawn-row{display:grid;grid-template-columns:1fr 1.5fr auto;gap:16px;align-items:center;padding:9px 16px;border-bottom:1px solid #131313;cursor:pointer;transition:background .1s}
.pawn-row:hover{background:var(--goldg)}
.pawn-row.cp{background:rgba(212,168,67,.12)}
.pawn-row .name{font-size:15px;color:var(--t1);font-weight:500}
.pawn-row .code{font-family:var(--mono);font-size:13px;color:var(--gold)}
.pawn-row .price{font-family:var(--mono);font-size:14px;color:var(--grn);text-align:right;font-weight:600}
.pawn-row .ck{font-size:12px;color:var(--gold)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--bg);padding:10px 28px;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:1px;z-index:99;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--t5);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--t4)}

@media(max-width:700px){
.sb{width:180px}
.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.card .label{font-size:13px}
}
</style>
</head>

var S={view:"items",q:"",cat:"All",mx:80,cc:null,ct:null,evts:[],co:{},evtView:null};

function getPw(){return localStorage.getItem("hl_pw")||DEFAULT_PW}
function init(){
  try{var e=localStorage.getItem("hl_events");if(e)S.evts=JSON.parse(e)}catch(x){}
  try{var c=localStorage.getItem("hl_co");if(c)S.co=JSON.parse(c)}catch(x){}
  document.getElementById("meta-info").textContent=RI.length+" items \u00b7 "+RW.length+" weapons";
  renderSidebar();renderContent();
}

function sEvts(){try{localStorage.setItem("hl_events",JSON.stringify(S.evts))}catch(x){}}

document.getElementById("login-btn").onclick=tryLogin;
document.getElementById("pw-input").addEventListener("keydown",function(e){if(e.key==="Enter")tryLogin()});
function tryLogin(){
  var inp=document.getElementById("pw-input");
  if(inp.value===getPw()){
    document.getElementById("login").style.display="none";
    document.getElementById("app").classList.add("show");init();
  }else{inp.classList.add("err");document.getElementById("pw-err").textContent="WRONG PASSWORD"}
}

function gItems(){return RI.map(function(i){return{c:i.c,l:i.l,t:S.co[i.c]||i.t}})}

function cc(code){
  navigator.clipboard.writeText(code).catch(function(){});
  S.cc=code;clearTimeout(S.ct);
  var t=document.getElementById("toast");t.textContent="COPIED: "+code;t.classList.add("show");
  S.ct=setTimeout(function(){S.cc=null;t.classList.remove("show");renderContent()},1200);
  renderContent();
}

function toast(msg){
  var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  setTimeout(function(){t.classList.remove("show")},1200);
}

function renderSidebar(){
  var items=gItems();var h='';
  h+='<div class="sb-search"><input id="sb-q" type="text" placeholder="Search..." value="'+eH(S.q)+'" oninput="onQ(this.value)"></div>';
  
  // Categories
  h+='<div class="sb-sect"><div class="sb-sect-title">CATEGORIES</div>';
  CATS.forEach(function(c){
    var cnt=c==="All"?items.length:items.filter(function(i){return i.t===c}).length;
    if(cnt===0&&c!=="All")return;
    var on=(S.view==="items"&&S.cat===c)?"on":"";
    h+='<div class="sb-item '+on+'" onclick="setCat(\''+c+'\')"><span class="n">'+c+'</span><span class="c">'+cnt+'</span></div>';
  });
  // Weapons
  var won=S.view==="weapons"?"on":"";
  h+='<div class="sb-item '+won+'" onclick="setView(\'weapons\')"><span class="n">Weapons</span><span class="c">'+RW.length+'</span></div>';
  // Pawn
  var pon=S.view==="pawn"?"on":"";
  h+='<div class="sb-item '+pon+'" onclick="setView(\'pawn\')"><span class="n">Pawn values</span><span class="c">'+Object.keys(PV).length+'</span></div>';
  h+='</div>';

  // Events
  h+='<div class="sb-sect"><div class="sb-sect-title">ACTIVE EVENTS</div>';
  if(S.evts.length===0){h+='<div style="padding:4px 16px;font-size:11px;color:var(--t4)">None yet</div>'}
  S.evts.forEach(function(ev,i){
    var on=(S.view==="event"&&S.evtView===i)?"on":"";
    h+='<div class="sb-evt-item '+on+'" onclick="viewEvt('+i+')"><span class="n">'+eH(ev.name)+' ('+ev.items.length+')</span>';
    h+='<button class="del" onclick="event.stopPropagation();delEvt('+i+')">\u00d7</button></div>';
  });
  h+='<div class="sb-add"><input id="ne" placeholder="New list..." onkeydown="if(event.key===\'Enter\')cEvt()"><button onclick="cEvt()">ADD</button></div>';
  h+='</div>';

  // Settings
  h+='<div class="sb-bottom"><button onclick="openPwModal()">CHANGE PASSWORD</button></div>';

  document.getElementById("sidebar").innerHTML=h;
}

function renderContent(){
  var el=document.getElementById("content");
  var q=S.q.toLowerCase();

  if(S.view==="event"){
    renderEvtView(el);return;
  }
  if(S.view==="pawn"){
    renderPawnView(el,q);return;
  }

  var data;
  if(S.view==="weapons"){data=RW.map(function(w){return{c:w.c,l:w.l,t:"Weapons"}})}
  else{data=gItems();if(S.cat!=="All")data=data.filter(function(i){return i.t===S.cat})}

  if(q)data=data.filter(function(i){return i.c.toLowerCase().indexOf(q)>-1||i.l.toLowerCase().indexOf(q)>-1});

  var label=S.view==="weapons"?"Weapons":S.cat;
  var h='<div class="content-info">'+data.length+' items'+(q?' matching "'+eH(S.q)+'"':' in '+label)+'</div>';
  h+='<div class="grid">';
  var en=S.evts.map(function(e){return e.name});
  var show=data.slice(0,S.mx);
  show.forEach(function(i){
    var cp=S.cc===i.c;
    h+='<div class="card'+(cp?' cp':'')+'" onclick="cc(\''+eA(i.c)+'\')">';
    h+='<div class="label">'+eH(i.l)+'</div>';
    h+='<div class="code">'+eH(i.c)+'</div>';
    h+='<div class="bottom">';
    if(cp){h+='<span class="copied-badge">\u2713 COPIED</span>'}else{
      h+='<div class="actions" onclick="event.stopPropagation()">';
      if(en.length>0){
        h+='<select onchange="aToE(this.value,\''+eA(i.c)+'\',\''+eA(i.l)+'\');this.value=\'\'"><option value="">+ event</option>';
        en.forEach(function(n){h+='<option value="'+eA(n)+'">'+eH(n)+'</option>'});
        h+='</select>';
      }
      if(S.view==="items"){
        h+='<select onchange="chCat(\''+eA(i.c)+'\',this.value)">';
        CATS.forEach(function(c){if(c!=="All")h+='<option'+(i.t===c?' selected':'')+'>'+c+'</option>'});
        h+='</select>';
      }
      h+='</div>';
    }
    h+='</div></div>';
  });
  h+='</div>';
  if(data.length>S.mx)h+='<button class="show-more" onclick="mMore()">Show more ('+(data.length-S.mx)+' remaining)</button>';
  el.innerHTML=h;
}

function renderPawnView(el,q){
  var data=gItems().filter(function(i){return PV[i.c]!==undefined});
  data.sort(function(a,b){return(PV[b.c]||0)-(PV[a.c]||0)});
  if(q)data=data.filter(function(i){return i.c.toLowerCase().indexOf(q)>-1||i.l.toLowerCase().indexOf(q)>-1});
  var h='<div class="content-info">'+data.length+' pawnable items'+(q?' matching "'+eH(S.q)+'"':'')+'  \u2014  sorted by value</div>';
  h+='<div class="pawn-list">';
  data.forEach(function(i){
    var cp=S.cc===i.c;
    h+='<div class="pawn-row'+(cp?' cp':'')+'" onclick="cc(\''+eA(i.c)+'\')">';
    h+='<span class="code">'+eH(i.c)+'</span>';
    h+='<span class="name">'+eH(i.l)+'</span>';
    h+='<span class="price">$'+PV[i.c].toLocaleString()+'</span>';
    h+='</div>';
  });
  h+='</div>';
  el.innerHTML=h;
}

function renderEvtView(el){
  var ev=S.evts[S.evtView];
  if(!ev){setView("items");return;}
  var q=S.q.toLowerCase();
  var data=ev.items;
  if(q)data=data.filter(function(i){return i.c.toLowerCase().indexOf(q)>-1||i.l.toLowerCase().indexOf(q)>-1});
  var h='<div class="content-info">'+eH(ev.name)+' \u2014 '+data.length+' items</div>';
  h+='<div class="evt-view">';
  if(data.length===0)h+='<div style="color:var(--t4);font-size:14px;padding:40px 0;text-align:center">Empty list. Go to a category and use the "+ event" dropdown on any card to add items here.</div>';
  data.forEach(function(it){
    var cp=S.cc===it.c;
    h+='<div class="evt-card'+(cp?' cp':'')+'" onclick="cc(\''+eA(it.c)+'\')">';
    h+='<span class="code">'+eH(it.c)+'</span>';
    h+='<span class="label">'+eH(it.l)+'</span>';
    h+='<button class="rm" onclick="event.stopPropagation();rFE('+S.evtView+',\''+eA(it.c)+'\')">\u00d7</button>';
    h+='<span class="ck">'+(cp?'\u2713':'')+'</span></div>';
  });
  h+='</div>';
  el.innerHTML=h;
}

function onQ(v){S.q=v;S.mx=80;renderContent()}
function setCat(c){S.view="items";S.cat=c;S.q="";S.mx=80;S.evtView=null;renderSidebar();renderContent();focusSearch()}
function setView(v){S.view=v;S.q="";S.mx=80;S.evtView=null;renderSidebar();renderContent();focusSearch()}
function viewEvt(i){S.view="event";S.evtView=i;S.q="";renderSidebar();renderContent();focusSearch()}
function mMore(){S.mx+=80;renderContent()}
function chCat(code,nc){S.co[code]=nc;sCo();renderSidebar();renderContent()}
function focusSearch(){var sb=document.getElementById("sb-q");if(sb){sb.focus();sb.selectionStart=sb.selectionEnd=sb.value.length}}

function aToE(en,code,label){
  var ev=S.evts.find(function(e){return e.name===en});
  if(ev&&!ev.items.find(function(i){return i.c===code})){
    ev.items.push({c:code,l:label});sEvts();renderSidebar();toast("Added to "+en);
  }
}
function cEvt(){
  var inp=document.getElementById("ne");if(!inp||!inp.value.trim())return;
  S.evts.push({name:inp.value.trim(),items:[]});sEvts();renderSidebar();
}
function delEvt(i){
  if(S.evtView===i){S.view="items";S.cat="All";S.evtView=null;}
  S.evts.splice(i,1);sEvts();renderSidebar();renderContent();
}
function rFE(ei,code){S.evts[ei].items=S.evts[ei].items.filter(function(i){return i.c!==code});sEvts();renderContent();renderSidebar()}

function openPwModal(){document.getElementById("pw-modal").classList.add("show");document.getElementById("pw-old").focus();document.getElementById("pw-msg").textContent=""}
function closePwModal(){document.getElementById("pw-modal").classList.remove("show");document.getElementById("pw-old").value="";document.getElementById("pw-new").value=""}
function savePw(){
  var old=document.getElementById("pw-old").value;
  var nw=document.getElementById("pw-new").value;
  var msg=document.getElementById("pw-msg");
  if(old!==getPw()){msg.className="msg err";msg.textContent="Current password is wrong";return}
  if(nw.length<3){msg.className="msg err";msg.textContent="Too short";return}
  localStorage.setItem("hl_pw",nw);
  msg.className="msg ok";msg.textContent="Password updated!";
  setTimeout(closePwModal,1000);
}

function eH(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function eA(s){return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
</script>
