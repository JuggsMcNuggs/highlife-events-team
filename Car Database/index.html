<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events Garage</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#111118;--surface2:#1a1a24;--border:#2a2a3a;--accent:#c084fc;--accent2:#818cf8;--gold:#fbbf24;--red:#f87171;--green:#4ade80;--text:#e2e8f0;--muted:#64748b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
header{background:linear-gradient(135deg,#0f0f1a,#1a0a2e);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:100;flex-wrap:wrap;}
header h1{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.header-sub{font-size:.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
.stats{display:flex;gap:20px;font-family:'DM Mono',monospace;font-size:.78rem;color:var(--muted);}
.stat-val{color:var(--accent);}
.tabs{display:flex;gap:4px;padding:14px 28px 0;border-bottom:1px solid var(--border);background:var(--surface);}
.tab{padding:9px 18px;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;font-size:.82rem;font-weight:500;color:var(--muted);background:transparent;transition:all .15s;position:relative;bottom:-1px;}
.tab:hover{color:var(--text);background:var(--surface2);}
.tab.active{color:var(--accent);background:var(--bg);border-color:var(--border);border-bottom-color:var(--bg);}
.tab-count{display:inline-block;background:var(--surface2);border-radius:10px;padding:1px 7px;font-size:.68rem;margin-left:5px;color:var(--muted);}
.tab.active .tab-count{background:var(--accent);color:#000;}
.toolbar{padding:14px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--border);}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:340px;}
.search-wrap input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 34px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.85rem;outline:none;transition:border-color .15s;}
.search-wrap input:focus{border-color:var(--accent);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;pointer-events:none;}
.cat-filters{display:flex;gap:5px;flex-wrap:wrap;}
.cat-btn{padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;font-size:.72rem;font-weight:500;transition:all .15s;white-space:nowrap;}
.cat-btn:hover{color:var(--text);}
.cat-btn.active{color:#000;font-weight:700;border-color:transparent;}
.cat-btn[data-cat="All"].active{background:var(--accent);}
.cat-btn[data-cat="LSPD"].active{background:#60a5fa;}
.cat-btn[data-cat="BCSO"].active{background:#34d399;}
.cat-btn[data-cat="EMS"].active{background:#f87171;}
.cat-btn[data-cat="DOA"].active{background:#a78bfa;}
.cat-btn[data-cat="FIB"].active{background:#fb923c;}
.cat-btn[data-cat="G6"].active{background:#94a3b8;}
.cat-btn[data-cat="Sports"].active{background:#f472b6;}
.cat-btn[data-cat="Muscle"].active{background:#fb923c;}
.cat-btn[data-cat="JDM"].active{background:#22d3ee;}
.cat-btn[data-cat="Offroad"].active{background:#86efac;}
.cat-btn[data-cat="Luxury"].active{background:#e2c08d;}
.cat-btn[data-cat="Bike"].active{background:#c084fc;}
.cat-btn[data-cat="Heli"].active{background:#67e8f9;}
.cat-btn[data-cat="Boat"].active{background:#38bdf8;}
.cat-btn[data-cat="Event"].active{background:#fde68a;}
.cat-btn[data-cat="Van"].active{background:#a8a29e;}
.cat-btn[data-cat="Classic"].active{background:#fca5a5;}
.cat-btn[data-cat="Other"].active{background:#6b7280;color:#fff;}
.grid-wrap{flex:1;overflow-y:auto;padding:18px 28px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px;display:flex;flex-direction:column;gap:7px;transition:border-color .15s,transform .1s;position:relative;overflow:hidden;cursor:pointer;}
footer{text-align:center;padding:18px;font-size:.72rem;color:var(--muted);border-top:1px solid var(--border);margin-top:8px;font-family:'DM Mono',monospace;letter-spacing:.5px;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity .2s;}
.card:hover{border-color:var(--accent);transform:translateY(-1px);}
.card:hover::before{opacity:1;background:linear-gradient(90deg,var(--accent),var(--accent2));}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:5px;}
.card-name{font-weight:500;font-size:.87rem;line-height:1.3;flex:1;}
.card-fav{background:none;border:none;cursor:pointer;font-size:.95rem;padding:2px;opacity:.25;transition:opacity .15s,transform .15s;color:var(--gold);}
.card-fav:hover{opacity:.7;transform:scale(1.2);}
.card-fav.active{opacity:1;}
.card-code{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--accent2);background:var(--surface2);padding:3px 7px;border-radius:5px;word-break:break-all;}
.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:1px;}
.cat-pill{font-size:.62rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 6px;border-radius:10px;background:var(--surface2);color:var(--muted);}
.cat-pill[data-cat="LSPD"]{background:rgba(96,165,250,.15);color:#60a5fa;}
.cat-pill[data-cat="BCSO"]{background:rgba(52,211,153,.15);color:#34d399;}
.cat-pill[data-cat="EMS"]{background:rgba(248,113,113,.15);color:#f87171;}
.cat-pill[data-cat="DOA"]{background:rgba(167,139,250,.15);color:#a78bfa;}
.cat-pill[data-cat="FIB"]{background:rgba(251,146,60,.15);color:#fb923c;}
.cat-pill[data-cat="G6"]{background:rgba(148,163,184,.15);color:#94a3b8;}
.cat-pill[data-cat="Sports"]{background:rgba(244,114,182,.15);color:#f472b6;}
.cat-pill[data-cat="Muscle"]{background:rgba(251,146,60,.15);color:#fb923c;}
.cat-pill[data-cat="JDM"]{background:rgba(34,211,238,.15);color:#22d3ee;}
.cat-pill[data-cat="Offroad"]{background:rgba(134,239,172,.15);color:#86efac;}
.cat-pill[data-cat="Luxury"]{background:rgba(226,192,141,.15);color:#e2c08d;}
.cat-pill[data-cat="Bike"]{background:rgba(192,132,252,.15);color:#c084fc;}
.cat-pill[data-cat="Heli"]{background:rgba(103,232,249,.15);color:#67e8f9;}
.cat-pill[data-cat="Boat"]{background:rgba(56,189,248,.15);color:#38bdf8;}
.cat-pill[data-cat="Event"]{background:rgba(253,230,138,.15);color:#fde68a;}
.cat-pill[data-cat="Van"]{background:rgba(168,162,158,.15);color:#a8a29e;}
.cat-pill[data-cat="Classic"]{background:rgba(252,165,165,.15);color:#fca5a5;}
.cat-pill[data-cat="Other"]{background:rgba(107,114,128,.15);color:#6b7280;}
.card-actions{display:flex;gap:4px;}
.btn-copy,.btn-list-add{font-size:.68rem;padding:3px 7px;border-radius:5px;border:1px solid var(--border);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .15s;background:var(--surface2);color:var(--muted);}
.btn-copy:hover{border-color:var(--accent2);color:var(--accent2);}
.btn-list-add:hover{border-color:var(--accent);color:var(--accent);}
.btn-copy.copied{background:var(--green);color:#000;border-color:var(--green);}
.btn-remove{font-size:.68rem;padding:3px 7px;border-radius:5px;border:1px solid var(--red);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .15s;background:transparent;color:var(--red);}
.btn-remove:hover{background:var(--red);color:#000;}
.empty-state{text-align:center;padding:70px 20px;color:var(--muted);grid-column:1/-1;}
.empty-big{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;letter-spacing:3px;color:var(--border);display:block;margin-bottom:8px;}
.lists-layout{display:flex;height:calc(100vh - 140px);}
.lists-sidebar{width:250px;min-width:250px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;}
.lists-sidebar-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.lists-sidebar-hdr h3{font-size:.75rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);}
.btn-new-list{background:var(--accent);color:#000;border:none;border-radius:6px;padding:5px 10px;font-size:.72rem;font-weight:700;cursor:pointer;}
.btn-new-list:hover{opacity:.85;}
.list-items{flex:1;overflow-y:auto;padding:8px;}
.list-item{padding:9px 11px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:6px;transition:background .1s;margin-bottom:2px;border-left:3px solid transparent;}
.list-item:hover{background:var(--surface2);}
.list-item.active{background:var(--surface2);border-left-color:var(--accent);}
.list-item-name{font-size:.85rem;font-weight:500;flex:1;}
.list-item-count{font-size:.68rem;color:var(--muted);font-family:'DM Mono',monospace;}
.list-delete{opacity:0;font-size:.75rem;color:var(--red);cursor:pointer;transition:opacity .15s;background:none;border:none;padding:2px 4px;}
.list-item:hover .list-delete{opacity:1;}
.list-content-area{flex:1;overflow-y:auto;padding:20px 24px;}
.list-empty-state{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted);}
.list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.list-header h2{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:3px;color:var(--accent);}
.list-header-meta{font-size:.75rem;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px;}
.btn-rename{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:.72rem;color:var(--muted);cursor:pointer;}
.btn-rename:hover{color:var(--text);border-color:var(--muted);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;width:370px;max-width:92vw;}
.modal h3{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:2px;margin-bottom:14px;color:var(--accent);}
.modal input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:9px 13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;outline:none;margin-bottom:12px;transition:border-color .15s;}
.modal input:focus{border-color:var(--accent);}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
.btn-cancel{padding:7px 15px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-confirm{padding:7px 15px;border-radius:7px;border:none;background:var(--accent);color:#000;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;}
.list-picker{display:flex;flex-direction:column;gap:5px;max-height:240px;overflow-y:auto;margin-bottom:12px;}
.list-pick-item{padding:9px 13px;border-radius:7px;border:1px solid var(--border);cursor:pointer;font-size:.85rem;background:var(--surface2);transition:all .12s;display:flex;align-items:center;justify-content:space-between;}
.list-pick-item:hover{border-color:var(--accent);color:var(--accent);}
.list-pick-count{font-size:.68rem;color:var(--muted);font-family:'DM Mono',monospace;}
</style>
</head>
<body>

<header>
  <div style="flex-shrink:0">
    <h1>Events Garage</h1>
    <div class="header-sub">Highlife RP · Vehicle Database</div>
  </div>
  <div class="search-wrap" style="max-width:220px">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-all" placeholder="Search…" oninput="renderAll()">
  </div>
  <div class="cat-filters" id="cat-filters" style="flex:1"></div>
  <div class="stats" style="flex-shrink:0">
    <span>Vehicles: <span class="stat-val" id="stat-total">0</span></span>
    <span>⭐ <span class="stat-val" id="stat-favs">0</span></span>
    <span>Lists: <span class="stat-val" id="stat-lists">0</span></span>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('all')">All Vehicles <span class="tab-count" id="tc-all">0</span></button>
  <button class="tab" onclick="switchTab('favs')">⭐ Favorites <span class="tab-count" id="tc-favs">0</span></button>
  <button class="tab" onclick="switchTab('lists')">📋 Lists <span class="tab-count" id="tc-lists">0</span></button>
</div>

<div id="tab-all">
  <div class="grid-wrap"><div class="grid" id="grid-all"></div></div>
</div>

<div id="tab-favs" style="display:none">
  <div class="grid-wrap"><div class="grid" id="grid-favs"></div></div>
</div>

<div id="tab-lists" style="display:none" class="lists-layout">
  <div class="lists-sidebar">
    <div class="lists-sidebar-hdr">
      <h3>My Lists</h3>
      <button class="btn-new-list" onclick="openModal('modal-newlist');setTimeout(()=>document.getElementById('input-newlist').focus(),100)">+ New</button>
    </div>
    <div class="list-items" id="list-sidebar-items"></div>
  </div>
  <div id="list-content-area" class="list-empty-state">
    <span class="empty-big">NO LIST SELECTED</span>
    <span style="font-size:.8rem">Create or select a list from the sidebar</span>
  </div>
</div>

<div class="modal-overlay" id="modal-newlist">
  <div class="modal">
    <h3>New List</h3>
    <input type="text" id="input-newlist" placeholder="e.g. 4th of July, Funeral RP…" maxlength="40" onkeydown="if(event.key==='Enter')confirmNewList()">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modal-newlist')">Cancel</button>
      <button class="btn-confirm" onclick="confirmNewList()">Create</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-addlist">
  <div class="modal">
    <h3>Add to List</h3>
    <div class="list-picker" id="list-picker-items"></div>
    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal('modal-addlist')">Cancel</button></div>
  </div>
</div>

<div class="modal-overlay" id="modal-rename">
  <div class="modal">
    <h3>Rename List</h3>
    <input type="text" id="input-rename" placeholder="New name…" maxlength="40" onkeydown="if(event.key==='Enter')confirmRename()">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modal-rename')">Cancel</button>
      <button class="btn-confirm" onclick="confirmRename()">Save</button>
    </div>
  </div>
</div>

const CATS=["All","LSPD","BCSO","EMS","DOA","FIB","G6","Sports","Muscle","JDM","Offroad","Luxury","Bike","Heli","Boat","Event","Van","Classic","Other"];
let vehicles=RAW.map((r,i)=>({id:i,name:r[0],code:r[1],cat:r[2]}));
let favorites=new Set(JSON.parse(localStorage.getItem('eg_favs')||'[]'));
let lists=JSON.parse(localStorage.getItem('eg_lists')||'{}');
let activeCat='All',activeList=null,pendingVid=null;

function save(){localStorage.setItem('eg_favs',JSON.stringify([...favorites]));localStorage.setItem('eg_lists',JSON.stringify(lists));}

function updateStats(){
  document.getElementById('stat-total').textContent=vehicles.length;
  document.getElementById('stat-favs').textContent=favorites.size;
  const lc=Object.keys(lists).length;
  document.getElementById('stat-lists').textContent=lc;
  document.getElementById('tc-all').textContent=vehicles.length;
  document.getElementById('tc-favs').textContent=favorites.size;
  document.getElementById('tc-lists').textContent=lc;
}

function switchTab(tab){
  ['all','favs','lists'].forEach((t,i)=>{
    document.getElementById('tab-'+t).style.display=t===tab?(t==='lists'?'flex':'block'):'none';
    document.querySelectorAll('.tab')[i].classList.toggle('active',t===tab);
  });
  if(tab==='all')renderAll();
  if(tab==='favs')renderFavs();
  if(tab==='lists')renderListsSidebar();
}

function buildCatFilters(){
  document.getElementById('cat-filters').innerHTML=CATS.map(c=>`<button class="cat-btn${c==='All'?' active':''}" data-cat="${c}" onclick="setCat('${c}')">${c}</button>`).join('');
}

function setCat(cat){
  activeCat=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
  renderAll();
}

function cardCopy(e,el,code){navigator.clipboard.writeText(code).then(()=>{el.style.borderColor='var(--green)';el.querySelector('.card-code').style.color='var(--green)';setTimeout(()=>{el.style.borderColor='';el.querySelector('.card-code').style.color='';},1200);});}

function filtered(pool,searchId){
  const q=(document.getElementById('search-all')?.value||'').toLowerCase();
  return pool.filter(v=>(!q||v.name.toLowerCase().includes(q)||v.code.toLowerCase().includes(q))&&(activeCat==='All'||v.cat===activeCat));
}

function card(v,inList=false){
  return `<div class="card" onclick="cardCopy(event,this,'${v.code}')" title="Click to copy spawn code"><div class="card-top"><div class="card-name">${v.name}</div><button class="card-fav${favorites.has(v.id)?' active':''}" onclick="event.stopPropagation();toggleFav(${v.id})">⭐</button></div><div class="card-code">${v.code}</div><div class="card-bottom"><span class="cat-pill" data-cat="${v.cat}">${v.cat}</span><div class="card-actions"><button class="btn-list-add" onclick="event.stopPropagation();openAddList(${v.id})">+ List</button>${inList?`<button class="btn-remove" onclick="event.stopPropagation();removeFromList(${v.id})">Remove</button>`:''}</div></div></div>`;
}

function empty(msg){return `<div class="empty-state"><span class="empty-big">${msg}</span></div>`;}

function renderAll(){document.getElementById('grid-all').innerHTML=(f=filtered(vehicles,'search-all')).length?f.map(v=>card(v)).join(''):empty('NO RESULTS');}
function renderFavs(){const fv=vehicles.filter(v=>favorites.has(v.id));const f=filtered(fv,'search-favs');document.getElementById('grid-favs').innerHTML=f.length?f.map(v=>card(v)).join(''):empty(favorites.size?'NO MATCHES':'NO FAVORITES YET');}

function toggleFav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);save();updateStats();renderAll();if(activeList)renderCurrentList();}

function copyCode(btn,code){navigator.clipboard.writeText(code).then(()=>{btn.textContent='✓ Copied';btn.classList.add('copied');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},1500);});}

function renderListsSidebar(){
  const keys=Object.keys(lists);
  document.getElementById('list-sidebar-items').innerHTML=keys.length?keys.map(n=>`<div class="list-item${activeList===n?' active':''}" onclick="selectList('${n.replace(/'/g,"\\'")}')"><span class="list-item-name">${n}</span><span class="list-item-count">${lists[n].length}</span><button class="list-delete" onclick="deleteList(event,'${n.replace(/'/g,"\\'")}')">✕</button></div>`).join(''):`<div style="padding:18px;color:var(--muted);font-size:.8rem;text-align:center">No lists yet</div>`;
  if(activeList&&lists[activeList])renderCurrentList();
}

function selectList(n){activeList=n;renderListsSidebar();}

function renderCurrentList(){
  if(!activeList||!lists[activeList])return;
  const vs=vehicles.filter(v=>lists[activeList].includes(v.id));
  const area=document.getElementById('list-content-area');
  area.className='list-content-area';
  area.innerHTML=`<div class="list-header"><div><h2>${activeList}</h2><div class="list-header-meta">${vs.length} vehicle${vs.length!==1?'s':''}</div></div><button class="btn-rename" onclick="openRename()">Rename</button></div><div class="grid">${vs.length?vs.map(v=>card(v,true)).join(''):empty('EMPTY LIST')}</div>`;
}

function removeFromList(id){if(!activeList)return;lists[activeList]=lists[activeList].filter(i=>i!==id);save();updateStats();renderCurrentList();renderListsSidebar();}

function openAddList(vid){
  pendingVid=vid;
  const keys=Object.keys(lists);
  document.getElementById('list-picker-items').innerHTML=keys.length?keys.map(n=>`<div class="list-pick-item" onclick="addToList('${n.replace(/'/g,"\\'")}')"><span>${n}</span><span class="list-pick-count">${lists[n].length}</span></div>`).join(''):`<div style="color:var(--muted);font-size:.85rem;padding:8px">No lists yet — go to the Lists tab to create one.</div>`;
  openModal('modal-addlist');
}

function addToList(n){if(pendingVid===null)return;if(!lists[n].includes(pendingVid))lists[n].push(pendingVid);save();updateStats();closeModal('modal-addlist');pendingVid=null;}

function confirmNewList(){const n=document.getElementById('input-newlist').value.trim();if(!n)return;if(!lists[n])lists[n]=[];activeList=n;save();updateStats();closeModal('modal-newlist');if(document.querySelector('.tab.active').textContent.includes('Lists'))renderListsSidebar();}

function deleteList(e,n){e.stopPropagation();delete lists[n];if(activeList===n){activeList=null;document.getElementById('list-content-area').className='list-empty-state';document.getElementById('list-content-area').innerHTML='<span class="empty-big">NO LIST SELECTED</span><span style="font-size:.8rem">Select a list from the sidebar</span>';}save();updateStats();renderListsSidebar();}

function openRename(){document.getElementById('input-rename').value=activeList||'';openModal('modal-rename');setTimeout(()=>document.getElementById('input-rename').focus(),100);}

function confirmRename(){const nw=document.getElementById('input-rename').value.trim();if(!nw||!activeList||nw===activeList){closeModal('modal-rename');return;}lists[nw]=lists[activeList];delete lists[activeList];activeList=nw;save();closeModal('modal-rename');renderListsSidebar();}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-overlay.open').forEach(m=>m.classList.remove('open'));});

buildCatFilters();updateStats();renderAll();
